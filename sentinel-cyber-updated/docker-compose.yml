version: '3.8'

services:
  mosquitto_sentinel:
    image: eclipse-mosquitto:latest
    container_name: mosquitto_sentinel
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      sentinel_network:
        ipv4_address: 192.168.10.10
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sentinel_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1

volumes:
  mosquitto_data:
    name: sentinel_mosquitto_data
  mosquitto_logs:
    name: sentinel_mosquitto_logs
